trigger:
- develop

pool:
  name: APPSEALING

steps:

# =========================================================
# 1. Setup Temporary Keychain and Install Certificate
# =========================================================
- script: |
    set -euxo pipefail

    echo "===== ENV CHECK ====="
    env | sort

    P12_CERT_PATH="$(Build.SourcesDirectory)/distribution.p12"
    PROVISIONING_PROFILE_PATH="$(Build.SourcesDirectory)/profile.mobileprovision"
    KEYCHAIN_PATH="$HOME/Library/Keychains/temp-keychain.keychain-db"
    KEYCHAIN_PASSWORD="temp123"

    echo "===== KEYCHAIN LIST (BEFORE) ====="
    security list-keychains

    if security list-keychains | grep -q "temp-keychain.keychain-db"; then
        echo "Deleting existing temporary keychain..."
        security delete-keychain "$KEYCHAIN_PATH"
    fi

    echo "Creating temporary keychain..."
    security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

    echo "Setting temporary keychain as default..."
    security list-keychains -d user -s "$KEYCHAIN_PATH"
    security default-keychain -s "$KEYCHAIN_PATH"
    security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
    security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"

    echo "Importing distribution certificate..."
    security import "$P12_CERT_PATH" \
      -k "$KEYCHAIN_PATH" \
      -P "$CERTIFICATE_PASSWORD" \
      -T /usr/bin/codesign

    security set-key-partition-list \
      -S apple-tool:,apple:,codesign: \
      -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

    echo "===== CODESIGN IDENTITIES ====="
    security find-identity -v -p codesigning

  displayName: 'Setup Temporary Keychain and Install Certificate'
  env:
    CERTIFICATE_PASSWORD: $(CERTIFICATE_PASSWORD)

# =========================================================
# 2. Install Provisioning Profile (MISSING PART FIXED)
# =========================================================
- script: |
    set -euxo pipefail

    echo "Installing provisioning profile..."
    mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
    cp "$(Build.SourcesDirectory)/profile.mobileprovision" \
       ~/Library/MobileDevice/Provisioning\ Profiles/

    echo "===== INSTALLED PROFILES ====="
    ls -al ~/Library/MobileDevice/Provisioning\ Profiles

    echo "===== PROFILE DETAIL ====="
    security cms -D -i "$(Build.SourcesDirectory)/profile.mobileprovision" > profile.plist
    /usr/libexec/PlistBuddy -c "Print :Name" profile.plist
    /usr/libexec/PlistBuddy -c "Print :UUID" profile.plist
    /usr/libexec/PlistBuddy -c "Print :TeamIdentifier" profile.plist
    /usr/libexec/PlistBuddy -c "Print :ExpirationDate" profile.plist
    /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" profile.plist

    PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" profile.plist)
    echo "##vso[task.setvariable variable=PROFILE_UUID]$PROFILE_UUID"

  displayName: 'Install Provisioning Profile (Verbose)'

# =========================================================
# 3. Extract Scheme and App Name (UNCHANGED + LOG)
# =========================================================
- script: |
    set -euxo pipefail

    SCHEME_NAME=$(xcodebuild -list -json | (python -c 'import sys, json; print(json.load(sys.stdin)["project"]["schemes"][0])' || python3 -c 'import sys, json; print(json.load(sys.stdin)["project"]["schemes"][0])'))
    APP_NAME=$(xcodebuild -list -json | (python -c 'import sys, json; print(json.load(sys.stdin)["project"]["targets"][0])' || python3 -c 'import sys, json; print(json.load(sys.stdin)["project"]["targets"][0])'))

    echo "##vso[task.setvariable variable=SCHEME_NAME]$SCHEME_NAME"
    echo "##vso[task.setvariable variable=APP_NAME]$APP_NAME"

    echo "[DEBUG] SCHEME_NAME=$SCHEME_NAME"
    echo "[DEBUG] APP_NAME=$APP_NAME"

  displayName: 'Extract Scheme and App Name'

# =========================================================
# 4. Increment Build Number (PATH LOG ONLY)
# =========================================================
- script: |
    # Automatically increment build number
    cd "/Users/puzznic/Project/Azure_Agent/_work/2/s/$(APP_NAME).xcodeproj"
    agvtool next-version -all
    NEW_BUILD_NUMBER=$(agvtool what-version -terse)
    echo "##vso[task.setvariable variable=BUILD_NUMBER]$NEW_BUILD_NUMBER"
    echo "##[debug] New Build Number: $NEW_BUILD_NUMBER"
  displayName: 'Increment Build Number'

# =========================================================
# 5. Extract Bundle ID + ExportOptions (LOG 강화)
# =========================================================
- script: |
    set -euxo pipefail

    INFO_PLIST_PATH="${BUILD_SOURCESDIRECTORY}/${APP_NAME}/Info.plist"
    BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST_PATH" || true)

    if [[ -z "$BUNDLE_ID" ]]; then
        BUNDLE_ID=$(xcodebuild -showBuildSettings \
          -project "${BUILD_SOURCESDIRECTORY}/Azure_Swift.xcodeproj" \
          -scheme "${SCHEME_NAME}" \
          | grep PRODUCT_BUNDLE_IDENTIFIER | awk '{print $3}')
    fi

    echo "BUNDLE_ID=$BUNDLE_ID"
    echo "##vso[task.setvariable variable=BUNDLE_ID]$BUNDLE_ID"

    EXPORT_DIR="$HOME/exports"
    mkdir -p "$EXPORT_DIR"

    cat << EOF > "$EXPORT_DIR/ExportOptions.plist"
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
      "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
        <key>method</key>
        <string>app-store</string>
        <key>teamID</key>
        <string>$TEAM_ID</string>
        <key>provisioningProfiles</key>
        <dict>
          <key>$BUNDLE_ID</key>
          <string>$PROVISIONING_PROFILE_NAME</string>
        </dict>
      </dict>
      </plist>
      EOF

    echo "===== ExportOptions.plist ====="
    cat "$EXPORT_DIR/ExportOptions.plist"

  displayName: 'Extract Bundle ID and Create ExportOptions.plist'
  env:
    TEAM_ID: $(TEAM_ID)
    PROVISIONING_PROFILE_NAME: $(PROVISIONING_PROFILE_NAME)

# =========================================================
# 6. Build and Export IPA (UUID FIX + LOG)
# =========================================================
- script: |
    set -euxo pipefail

    echo "===== DERIVED DATA CLEAN ====="
    rm -rf ~/Library/Developer/Xcode/DerivedData/*

    EXPORT_DIR="$(Build.ArtifactStagingDirectory)"
    ARCHIVE_PATH="$EXPORT_DIR/$(APP_NAME).xcarchive"

    echo "===== BUILD SETTINGS ====="
    xcodebuild -project Azure_Swift.xcodeproj \
      -scheme "$(SCHEME_NAME)" \
      -configuration Release \
      -showBuildSettings | egrep "CODE_SIGN|PROVISIONING|DEVELOPMENT_TEAM"

    echo "===== ARCHIVE START ====="
    xcodebuild \
      -project Azure_Swift.xcodeproj \
      -scheme "$(SCHEME_NAME)" \
      -sdk iphoneos \
      -configuration Release \
      clean archive \
      -archivePath "$ARCHIVE_PATH" \
      CODE_SIGN_STYLE=Manual \
      DEVELOPMENT_TEAM="$TEAM_ID" \
      CODE_SIGN_IDENTITY="Apple Distribution" \
      PROVISIONING_PROFILE="$PROFILE_UUID" \
      OTHER_CODE_SIGN_FLAGS="--verbose"

    echo "===== EXPORT IPA ====="
    xcodebuild -exportArchive \
      -archivePath "$ARCHIVE_PATH" \
      -exportOptionsPlist "$HOME/exports/ExportOptions.plist" \
      -exportPath "$EXPORT_DIR" \
      -verbose

  displayName: 'Build and Export IPA'
  env:
    TEAM_ID: $(TEAM_ID)

# =========================================================
# 7. Cleanup (UNCHANGED)
# =========================================================
- script: |
    security delete-keychain "$HOME/Library/Keychains/temp-keychain.keychain-db" || true
  displayName: 'Cleanup Temporary Keychain'
